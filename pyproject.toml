[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drl-airfoil-optimization"
version = "0.1.0"
description = "Deep reinforcement learning for airfoil shape optimization"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Babu" }]
dependencies = [
  "numpy>=1.24",
  "gymnasium>=0.29",
  "stable-baselines3>=2.1",
  "neuralfoil>=0.3",
  "xfoil>=1.1",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
